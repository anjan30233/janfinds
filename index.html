<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAN FINDS ♡ | Fashion Boutique</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#fffaf8;color:#49343b}
header{background:#fcecf0;padding:17px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-family:'Playfair Display',serif;font-size:27px;color:#a65772}
header a{color:#a65772;text-decoration:none;font-weight:600}
.hero{text-align:center;padding:55px 15px;background:linear-gradient(135deg,#fcecf0,#fff7f3)}
.hero h1{font-family:'Playfair Display',serif;font-size:38px;color:#a65772}
.hero p{margin:12px 0;color:#805b68}
button{cursor:pointer;border:0;border-radius:25px;padding:11px 18px;background:#a65772;color:white;font-weight:600}
.search{display:block;width:90%;max-width:500px;margin:25px auto;padding:13px;border:1px solid #edcbd6;border-radius:25px;background:white}
.categories{display:flex;gap:10px;overflow-x:auto;padding:10px 5%;justify-content:center}
.categories button{white-space:nowrap}
.products{padding:25px 5%;display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:17px}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 15px #0000000b}
.card img{width:100%;height:210px;object-fit:cover;background:#f8e9ed}
.info{padding:12px}
.info h3{font-size:14px;margin-bottom:7px}
.price{color:#a65772;font-weight:700}
.old{color:#999;text-decoration:line-through;font-size:12px;margin-left:5px}
.info button{width:100%;margin-top:10px}
.section-title{text-align:center;font-family:'Playfair Display',serif;color:#a65772;margin-top:25px}
#cart{background:#fcecf0;margin:25px 5%;padding:20px;border-radius:15px}
.cart-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e9cbd4}
#cart button{margin-top:12px}
footer{text-align:center;background:#fcecf0;padding:25px;color:#805b68;margin-top:30px}
.empty{text-align:center;padding:30px;color:#9b7884;grid-column:1/-1}
@media(max-width:600px){
.hero h1{font-size:30px}
.products{grid-template-columns:repeat(2,minmax(0,1fr));padding:15px 4%;gap:12px}
.card img{height:190px}
.categories{justify-content:flex-start}
}
</style>
</head>

<body>

<header>
  <div class="logo">JAN FINDS ♡</div>
  <a href="#cart">🛍 Cart (<span id="cartCount">0</span>)</a>
</header>

<section class="hero">
  <h1>Find Your Pretty Style ♡</h1>
  <p>Little fashion finds, made for you.</p>
  <a href="#shop"><button>Explore Collection</button></a>
</section>

<input class="search" id="search" type="search" placeholder="Search your favourite outfit...">

<h2 class="section-title" id="shop">Our Collection ♡</h2>

<div class="categories" id="categories">
  <button onclick="filterCategory('All')">All</button>
</div>

<div class="products" id="products">
  <div class="empty">Loading pretty finds...</div>
</div>

<section id="cart">
  <h2 class="section-title">Your Shopping Cart ♡</h2>
  <div id="cartItems"><p>Your cart is empty.</p></div>
  <h3 style="margin-top:15px">Total: ₹<span id="total">0</span></h3>
  <button onclick="checkout()">Proceed to Checkout</button>
</section>

<footer>
  <h2 class="logo">JAN FINDS ♡</h2>
  <p>Thank you for visiting our little boutique.</p>
  <p>© 2026 JAN FINDS</p>
</footer>

<script>
const SUPABASE_URL = "https://dbbvlhzjxrubbxkrwkqe.supabase.co";
const SUPABASE_KEY = "sb_publishable_KpVdLbilszJmNCzT69GlYg_Ed8ffEkv";
const ORDER_URL = SUPABASE_URL + "/functions/v1/create-order";

let allProducts = [];
let cart = [];
let activeCategory = "All";

async function loadProducts(){
  const box = document.getElementById("products");

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/products?select=*&order=created_at.desc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok) throw new Error("Products could not load");

    allProducts = await response.json();

    showCategories();
    displayProducts(allProducts);

  } catch(error) {
    box.innerHTML = '<p class="empty">Products load nahi ho paaye. Please try again.</p>';
  }
}

function showCategories(){
  const categories = ["All", ...new Set(
    allProducts.map(p => p.category).filter(Boolean)
  )];

  document.getElementById("categories").innerHTML =
    categories.map(c =>
      `<button onclick="filterCategory(${JSON.stringify(c)})">${c}</button>`
    ).join("");
}

function filterCategory(category){
  activeCategory = category;
  filterProducts();
}

function filterProducts(){
  const search = document.getElementById("search").value.toLowerCase();

  const filtered = allProducts.filter(p => {
    const matchesCategory =
      activeCategory === "All" || p.category === activeCategory;

    const matchesSearch =
      (p.name || "").toLowerCase().includes(search);

    return matchesCategory && matchesSearch;
  });

  displayProducts(filtered);
}

document.getElementById("search").addEventListener("input",filterProducts);

function displayProducts(products){
  const box = document.getElementById("products");

  if(!products.length){
    box.innerHTML = '<p class="empty">No products found ♡</p>';
    return;
  }

  box.innerHTML = products.map(p => `
    <div class="card">
      <img src="${escapeHTML(p.image1 || "")}" alt="${escapeHTML(p.name || "Product")}">
      <div class="info">
        <h3>${escapeHTML(p.name || "Fashion Find")}</h3>
        <span class="price">₹${Number(p.price) || 0}</span>
        ${p.original_price ? `<span class="old">₹${Number(p.original_price)}</span>` : ""}
        <button onclick="addToCart('${String(p.id).replace(/'/g,"")}')">
          Add to Cart ♡
        </button>
      </div>
    </div>
  `).join("");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function addToCart(id){
  const product = allProducts.find(p => String(p.id) === String(id));
  if(!product) return;

  const existing = cart.find(item => String(item.id) === String(id));

  if(existing){
    existing.quantity++;
  } else {
    cart.push({
      id:product.id,
      name:product.name,
      price:Number(product.price),
      quantity:1
    });
  }

  updateCart();
  alert("Added to cart ♡");
}

function updateCart(){
  const box = document.getElementById("cartItems");
  let total = 0;
  let count = 0;

  if(!cart.length){
    box.innerHTML = "<p>Your cart is empty.</p>";
  } else {
    box.innerHTML = cart.map((item,index) => {
      total += item.price * item.quantity;
      count += item.quantity;

      return `
        <div class="cart-row">
          <span>${escapeHTML(item.name)} × ${item.quantity}</span>
          <span>₹${item.price * item.quantity}
          <button onclick="removeItem(${index})">×</button></span>
        </div>
      `;
    }).join("");
  }

  document.getElementById("total").textContent = total;
  document.getElementById("cartCount").textContent = count;
}

function removeItem(index){
  cart.splice(index,1);
  updateCart();
}

async function checkout(){
  if(!cart.length){
    alert("Your cart is empty!");
    return;
  }

  const customerName = prompt("Enter customer name:");
  if(!customerName) return;

  const phone = prompt("Enter phone number:");
  if(!phone) return;

  const address = prompt("Enter delivery address:");
  if(!address) return;

  if(!/^[0-9]{10}$/.test(phone)){
    alert("Please enter a valid 10-digit phone number.");
    return;
  }

  if(!confirm("Submit this test order? Use dummy details only.")){
    return;
  }

  try {
    for(const item of cart){
      const response = await fetch(ORDER_URL,{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY
        },
        body:JSON.stringify({
          customer_name:customerName,
          phone:phone,
          address:address,
          product_name:item.name,
          quantity:item.quantity
        })
      });

      const result = await response.json();

      if(!response.ok || !result.success){
        throw new Error(result.error || "Order failed");
      }
    }

    alert("Test order submitted successfully!");
    cart = [];
    updateCart();

  } catch(error) {
    alert("Order failed: " + error.message);
  }
}

loadProducts();
updateCart();
</script>

</body>
</html>
